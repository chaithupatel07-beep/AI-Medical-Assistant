databases:
  - name: ai-medical-assistant-db
    databaseName: ai_medical_assistant
    user: ai_med_user
    plan: free

services:
  - type: web
    name: ai-medical-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-medical-assistant-db
          property: connectionString
      - key: UPLOAD_DIR
        value: ./uploads
      - key: AI_PROVIDER
        value: gemini
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_VISION_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-medical-assistant.onrender.com
