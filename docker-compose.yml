services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_medical_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_change_me}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_medical_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_NAME: AI Medical Assistant
      APP_ENV: production
      PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-strong-32-char-secret}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_change_me}@db:5432/${POSTGRES_DB:-ai_medical_assistant}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gemini-2.5-flash}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gemini-2.5-flash}
      UPLOAD_DIR: /app/backend/uploads
    volumes:
      - uploads_data:/app/backend/uploads

volumes:
  pg_data:
  uploads_data:
